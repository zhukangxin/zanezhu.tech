{% extends "base.html" %}
{% block content %}
<div class="wrap">
  <header class="page-head">
    <p class="eyebrow">{{ p(profile, 'name', lang) }}</p>
    <h1>{{ ui.projects_title }}</h1>
    <p class="lede">{{ ui.projects_intro }}</p>
  </header>
  {% if projects %}
  <div class="project-grid" style="padding-bottom:72px">
    {% for pr in projects %}{% include "_project_card.html" %}{% endfor %}
  </div>
  {% else %}
  <p class="empty" style="margin-bottom:72px">{{ ui.projects_empty }}</p>
  {% endif %}
</div>
{% endblock %}
