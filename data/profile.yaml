      - "新业务进入战略：2014年独立完成中国云服务行业研究（使用Python进行数据分析），识别应优先进入的行业（银行与保险）与应回避的行业（化工）；参与云服务战略设计，被高管层采纳为集团重点战略；参与集团年度811规划，负责云服务、大IT战略部分。"
