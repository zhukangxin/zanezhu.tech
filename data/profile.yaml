      - "Vision & mission: Led the 2017 group vision-and-mission study, benchmarking Microsoft, GE and others; built vision and mission into the strategy management system and helped shift Huawei's vision toward a \"digital and intelligent world\"."
      - "New-business entry: In 2014 independently completed a China cloud-services industry study (with Python-based data analysis) that identified which industries to enter first (banking and insurance) and which to avoid (chemicals); contributed to the cloud strategy adopted as a group priority, and to the annual 811 plan for cloud and enterprise IT."
