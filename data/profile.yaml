experience:
  - org_en: "Citibank (China)"
    org_zh: "花旗银行（中国）"
    role_en: "VP, Digital Innovation Product Manager (Cross-border Payments), Treasury & Trade Solutions"
    role_zh: "交易银行部（TTS）数字创新产品经理（跨境支付）VP"
    start: "2018.11"
    end: "2026.07"
    location_en: "Shanghai"
    location_zh: "上海"
    bullets_en:
      - "Strategy: As a core member of Citi China's Digital Council, built the digital strategy framework and led the 3A strategy (All-online, Automated, Autonomous). Proven first in payments, it was adopted as Citi China's firmwide strategy framework for 2025 across all product lines."
      - "Enterprise rollout: Led 3A implementation and the Paperless program, changing how 227 people across 8 functions work — Operations, Relationship Managers, Sales, Technology, Compliance, Product, the CEO Office and the CIO Office."
      - "Client go-to-market: Created the 3L strategy (Paperless → InfoLess → InfoLeast), rolled out by client maturity and risk level; paperless adoption rose from 57% to 92%."
      - "Platform innovation: Designed COMPASS, a low-code rules platform that turned regulatory rule changes from development work into configuration, cutting delivery from 1–2 years to 1–2 months. Evolved payment review from manual checks to rules automation + AI judgment + human review, automating 80% of goods-trade payment reviews."
      - "Pilots: Ran an auto-collection pilot for 130 low-risk corporate clients, cutting posting time from about 20 minutes to under 1 minute. Led LLM pilots — unstructured document extraction and a RAG regulatory assistant — that reduced regulation lookup time in rule design by about 70%."
      - "Ecosystem: Worked with the Payment & Clearing Association of China, the Shanghai and Beijing clearing associations, the Shanghai and Shenzhen Customs Single Window, and a SWIFT service bureau; led vendor selection and tendering for the PANDA, EDGE and COMPASS platforms."
      - "Data & tools: Used SQLite and Python for local rule validation, operational data validation and scenario simulation; Microsoft Access to maintain and analyze recurring operations data, produce periodic reports, and design data structures and UI elements for product prototypes; Power BI for data preprocessing and cleansing; and SharePoint for cross-team collaboration."
    bullets_zh:
      - "战略制定：作为数字化委员会核心成员，搭建花旗中国数字化战略与框架，组织高管数字化趋势研讨；牵头制定3A战略（全线上、自动化、自主化），经支付业务验证后被采纳为花旗中国2025年全行战略框架，覆盖全部产品线。"
      - "全面推广：主导3A落地与无纸化项目，涉及运营、客户经理、销售、科技、合规、产品、CEO办公室、CIO办公室8个职能共227人的工作方式转变。"
      - "客户进入策略：首创3L客户推广策略（Paperless → InfoLess → InfoLeast），按客户成熟度与风险等级分层推进，无纸化采纳率由57%提升至92%。"
      - "模式创新：设计低代码规则平台COMPASS，使监管规则变更由开发改为配置，交付周期由1–2年缩短至1–2个月；推动付款审核从人工到「规则自动化＋AI判断＋人工复核」演进，80%货物贸易付款审核实现自动化。"
      - "试点验证：开展自动收款试点，覆盖130家低风险企业客户，单笔入账由约20分钟降至1分钟以内；牵头大模型试点（非结构化单据信息提取、RAG法规助手），规则设计中的法规查询时间减少约70%。"
      - "外部协同：对接中国支付清算协会、上海及北京支付清算协会、上海及深圳海关单一窗口、SWIFT接入服务商；牵头PANDA、EDGE、COMPASS供应商遴选与招标。"
      - "数据与工具：使用SQLite和Python进行本地化规则验证、运营数据验证和场景模拟；使用Access维护和分析定期运营数据、生成定期报告，并设计产品原型的数据结构与界面要素；使用Power BI进行数据预处理和清洗；使用SharePoint进行跨团队协作。"

