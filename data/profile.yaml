intro_en: "I turn strategy into products that ship — then into operating models that scale."
intro_zh: "把战略变成能上线的产品，再把产品变成可复制的运营模式。"

summary_en: >-
  Over 20 years across telecom, high-tech and banking. Nearly eight years at Citi China
  leading digital strategy and cross-border payment products; more than eight years of
  strategy consulting and corporate planning at Accenture, Huawei Group Strategy,
  METATHINK and SUNIVO; and an early career building software products and teams at
  Lucent and Wondertek. I break complex problems down from an enterprise-wide view,
  turn strategy into executable plans, prove them in pilots, and then scale them across
  the organization.
summary_zh: "20余年横跨电信、高科技与银行业：在花旗中国近8年牵头数字化战略与跨境支付产品；8年以上战略咨询与企划管理经验（埃森哲、华为集团战略规划部、根元咨询、春宇集团）；早期在朗讯与网达从事软件产品研发与团队管理。擅长从集团视角拆解复杂问题，把战略转化为可执行的行动方案，并推动试点验证与全面推广。"

