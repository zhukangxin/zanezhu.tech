<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" role="img" aria-label="AI 的权限逐级获得" font-family="-apple-system,'Segoe UI','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a958a"/></marker></defs>
<rect width="760" height="384" rx="14" fill="#fffdf8"/>
<text x="24" y="34" font-size="16" font-weight="600" fill="#1b1d22">AI 的权限逐级获得</text>
<text x="24" y="56" font-size="12" fill="#5b5f68">授权范围取决于交易类型、风险等级、金额、客户群体和业务场景</text>
<path d="M240 260H262" fill="none" stroke="#9a958a" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M480 260H502" fill="none" stroke="#9a958a" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="24" y="180" width="216" height="120" rx="8" fill="none" stroke="#9a958a" stroke-width="1.4"/>
<text x="40" y="204" font-size="13.5" font-weight="600" fill="#1b1d22">第一层 · AI 建议</text>
<text x="40" y="224" font-size="12" fill="#5b5f68">人工决定</text>
<text x="40" y="252" font-size="12" fill="#1b1d22">AI 提供建议、相关证据</text>
<text x="40" y="270" font-size="12" fill="#1b1d22">和解释</text>
<rect x="264" y="135" width="216" height="165" rx="8" fill="none" stroke="#9a958a" stroke-width="1.4"/>
<text x="280" y="159" font-size="13.5" font-weight="600" fill="#1b1d22">第二层 · AI 准备决策</text>
<text x="280" y="179" font-size="12" fill="#5b5f68">人工确认</text>
<text x="280" y="207" font-size="12" fill="#1b1d22">AI 形成完整的建议决策</text>
<text x="280" y="225" font-size="12" fill="#1b1d22">最终批准权仍属于</text>
<text x="280" y="243" font-size="12" fill="#1b1d22">授权人员</text>
<rect x="504" y="90" width="216" height="210" rx="8" fill="#e2ece9" stroke="#0f5b57" stroke-width="2"/>
<text x="520" y="114" font-size="13.5" font-weight="600" fill="#0f5b57">第三层 · AI 执行</text>
<text x="520" y="134" font-size="12" fill="#5b5f68">在批准范围内</text>
<text x="520" y="162" font-size="12" fill="#1b1d22">仅限经充分评估、</text>
<text x="520" y="180" font-size="12" fill="#1b1d22">获得明确授权的</text>
<text x="520" y="198" font-size="12" fill="#1b1d22">低风险事项</text>
<rect x="24" y="316" width="696" height="44" rx="8" fill="#efeadf" stroke="#9a958a" stroke-width="1.4"/>
<text x="372" y="343" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1b1d22">强制性合规规则在每一层都保持权威</text>
</svg>
