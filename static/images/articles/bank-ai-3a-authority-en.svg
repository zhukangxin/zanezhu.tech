<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" role="img" aria-label="AI earns authority one level at a time" font-family="-apple-system,'Segoe UI','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a958a"/></marker></defs>
<rect width="760" height="384" rx="14" fill="#fffdf8"/>
<text x="24" y="34" font-size="16" font-weight="600" fill="#1b1d22">AI earns authority one level at a time</text>
<text x="24" y="56" font-size="12" fill="#5b5f68">Scope depends on transaction type, risk, amount, client segment and scenario</text>
<path d="M240 260H262" fill="none" stroke="#9a958a" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M480 260H502" fill="none" stroke="#9a958a" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="24" y="180" width="216" height="120" rx="8" fill="none" stroke="#9a958a" stroke-width="1.4"/>
<text x="40" y="204" font-size="13.5" font-weight="600" fill="#1b1d22">Level 1 · AI recommends</text>
<text x="40" y="224" font-size="12" fill="#5b5f68">Humans decide</text>
<text x="40" y="252" font-size="12" fill="#1b1d22">AI offers suggestions,</text>
<text x="40" y="270" font-size="12" fill="#1b1d22">evidence and explanations</text>
<rect x="264" y="135" width="216" height="165" rx="8" fill="none" stroke="#9a958a" stroke-width="1.4"/>
<text x="280" y="159" font-size="13.5" font-weight="600" fill="#1b1d22">Level 2 · AI prepares</text>
<text x="280" y="179" font-size="12" fill="#5b5f68">Humans confirm</text>
<text x="280" y="207" font-size="12" fill="#1b1d22">AI assembles a proposed</text>
<text x="280" y="225" font-size="12" fill="#1b1d22">decision; approval stays</text>
<text x="280" y="243" font-size="12" fill="#1b1d22">with an authorized person</text>
<rect x="504" y="90" width="216" height="210" rx="8" fill="#e2ece9" stroke="#0f5b57" stroke-width="2"/>
<text x="520" y="114" font-size="13.5" font-weight="600" fill="#0f5b57">Level 3 · AI executes</text>
<text x="520" y="134" font-size="12" fill="#5b5f68">Within approved boundaries</text>
<text x="520" y="162" font-size="12" fill="#1b1d22">Selected low-risk actions,</text>
<text x="520" y="180" font-size="12" fill="#1b1d22">only after evaluation and</text>
<text x="520" y="198" font-size="12" fill="#1b1d22">explicit authorization</text>
<rect x="24" y="316" width="696" height="44" rx="8" fill="#efeadf" stroke="#9a958a" stroke-width="1.4"/>
<text x="372" y="343" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1b1d22">Deterministic compliance rules remain authoritative at every level</text>
</svg>
