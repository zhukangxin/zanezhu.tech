<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="按客户成熟度和风险等级分层推广" font-family="-apple-system,'Segoe UI','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a958a"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f5b57"/></marker></defs>
<rect width="760" height="430" rx="14" fill="#fffdf8"/>
<text x="24" y="36" font-size="16" font-weight="600" fill="#1b1d22">按客户成熟度和风险等级分层推广</text>
<text x="24" y="58" font-size="12" fill="#5b5f68">每个客户一次只迈一步</text>
<rect x="24" y="196" width="196" height="120" rx="8" fill="none" stroke="#9a958a" stroke-width="1.4"/>
<text x="40" y="222" font-size="13.5" font-weight="600" fill="#1b1d22">1 · Paperless 无纸化</text>
<text x="40" y="246" font-size="12" fill="#5b5f68">用电子提交</text>
<text x="40" y="263" font-size="12" fill="#5b5f68">代替纸质单据</text>
<path d="M222 256H238" fill="none" stroke="#9a958a" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="240" y="152" width="196" height="120" rx="8" fill="none" stroke="#9a958a" stroke-width="1.4"/>
<text x="256" y="178" font-size="13.5" font-weight="600" fill="#1b1d22">2 · InfoLess 少信息</text>
<text x="256" y="202" font-size="12" fill="#5b5f68">能自己取到的信息，</text>
<text x="256" y="219" font-size="12" fill="#5b5f68">不再向客户要（第二篇）</text>
<path d="M438 212H454" fill="none" stroke="#9a958a" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="456" y="88" width="284" height="300" rx="8" fill="#e2ece9" stroke="#0f5b57" stroke-width="2"/>
<text x="472" y="114" font-size="13.5" font-weight="600" fill="#0f5b57">3 · InfoLeast 最少信息</text>
<text x="472" y="138" font-size="12" fill="#5b5f68">对低风险客户，只要求</text>
<text x="472" y="155" font-size="12" fill="#5b5f68">规则规定的最低限度信息</text>
<rect x="470" y="186" width="256" height="52" rx="8" fill="#fffdf8" stroke="#9a958a" stroke-width="1.4"/>
<text x="484" y="207" font-size="12" font-weight="600" fill="#1b1d22">支付前的快速通道</text>
<text x="484" y="225" font-size="11" fill="#5b5f68">规则或 AI 识别低风险场景，优先处理</text>
<rect x="470" y="248" width="256" height="52" rx="8" fill="#fffdf8" stroke="#9a958a" stroke-width="1.4"/>
<text x="484" y="269" font-size="12" font-weight="600" fill="#1b1d22">加强支付后的预警</text>
<text x="484" y="287" font-size="11" fill="#5b5f68">规则或 AI 识别可疑交易，事后复核</text>
<rect x="470" y="310" width="256" height="52" rx="8" fill="#fffdf8" stroke="#9a958a" stroke-width="1.4"/>
<text x="484" y="331" font-size="12" font-weight="600" fill="#1b1d22">始终保持 Human in the Loop</text>
<text x="484" y="349" font-size="11" fill="#5b5f68">随时可通过规则切回人工复核</text>
<text x="24" y="352" font-size="12" fill="#5b5f68">动因：外汇监管的贸易便利化试点 [1]</text>
<text x="24" y="376" font-size="12" fill="#1b1d22">通过销售、客户经理培训和定期客户培训，共同推动</text>
</svg>
