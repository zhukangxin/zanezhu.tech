<text x="40" y="194" font-size="13.5" font-weight="600" fill="#1b1d22">1 · All Online</text>
<text x="40" y="214" font-size="12" fill="#5b5f68">Digitize and structure</text>
<text x="40" y="242" font-size="12" fill="#1b1d22">Structured business data</text>
<text x="40" y="260" font-size="12" fill="#1b1d22">Standard integration APIs</text>
<text x="40" y="278" font-size="12" fill="#1b1d22">Digital workflow records</text>
<text x="40" y="296" font-size="12" fill="#1b1d22">Permissions and audit trails</text>
