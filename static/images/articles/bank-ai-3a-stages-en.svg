<text x="520" y="180" font-size="12" fill="#1b1d22">Progressive authority levels</text>
<text x="520" y="198" font-size="12" fill="#1b1d22">Deterministic controls rule</text>
<text x="520" y="216" font-size="12" fill="#1b1d22">Tested fallback and rollback</text>
<text x="372" y="386" font-size="12" text-anchor="middle" fill="#5b5f68">Lower stages remain the controlled fallback</text>
