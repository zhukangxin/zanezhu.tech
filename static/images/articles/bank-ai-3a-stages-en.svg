<text x="280" y="154" font-size="13.5" font-weight="600" fill="#1b1d22">2 · Automatic</text>
<text x="280" y="174" font-size="12" fill="#5b5f68">Automate confirmed rules</text>
<text x="280" y="202" font-size="12" fill="#1b1d22">Versioned rule base</text>
<text x="280" y="220" font-size="12" fill="#1b1d22">Exception handling</text>
<text x="280" y="238" font-size="12" fill="#1b1d22">Human decision evidence</text>
<text x="280" y="256" font-size="12" fill="#1b1d22">Embedded governance</text>
<rect x="504" y="90" width="216" height="240" rx="8" fill="#e2ece9" stroke="#0f5b57" stroke-width="2"/>
<text x="520" y="114" font-size="13.5" font-weight="600" fill="#0f5b57">3 · Autonomous</text>
