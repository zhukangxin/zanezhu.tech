<path d="M480 250H502" fill="none" stroke="#9a958a" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M612 330V362H132V334" fill="none" stroke="#9a958a" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar)"/>
