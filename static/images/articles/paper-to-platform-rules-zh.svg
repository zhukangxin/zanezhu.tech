<text x="526.0" y="236.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1d22">三方审批</text>
<text x="526.0" y="253.5" font-size="11.5" text-anchor="middle" fill="#5b5f68">合规、产品、</text>
<text x="526.0" y="270.5" font-size="11.5" text-anchor="middle" fill="#5b5f68">运营共同签字</text>
<path d="M592 249H606" fill="none" stroke="#0f5b57" stroke-width="1.4" marker-end="url(#arA)"/>
<rect x="608" y="214" width="128" height="70" rx="8" fill="#e2ece9" stroke="#0f5b57" stroke-width="2"/>
<text x="672.0" y="245.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0f5b57">规则上线</text>
<text x="672.0" y="262.0" font-size="11.5" text-anchor="middle" fill="#5b5f68">按月算</text>
<text x="24" y="326" font-size="12" fill="#1b1d22">• 只自动化已经确认的规则；模糊的情况留给人来判断。</text>
<text x="24" y="350" font-size="12" fill="#1b1d22">• 懂规则的人可以自己改规则：技术的 DevOps 变成了产品的 DevOps。</text>
</svg>
