<text x="380.0" y="152.0" font-size="11.5" text-anchor="middle" fill="#5b5f68">复杂的预算竞争</text>
<path d="M446 139H460" fill="none" stroke="#9a958a" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="462" y="104" width="128" height="70" rx="8" fill="none" stroke="#9a958a" stroke-width="1.4"/>
<text x="526.0" y="135.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1d22">供应商开发</text>
<text x="526.0" y="152.0" font-size="11.5" text-anchor="middle" fill="#5b5f68">编码、测试、发布</text>
