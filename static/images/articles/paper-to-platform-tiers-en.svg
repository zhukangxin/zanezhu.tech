<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Roll out by client maturity and risk" font-family="-apple-system,'Segoe UI','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a958a"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f5b57"/></marker></defs>
<rect width="760" height="430" rx="14" fill="#fffdf8"/>
<text x="24" y="36" font-size="16" font-weight="600" fill="#1b1d22">Roll out by client maturity and risk</text>
<text x="24" y="58" font-size="12" fill="#5b5f68">Each client moves one step at a time</text>
<rect x="24" y="196" width="196" height="120" rx="8" fill="none" stroke="#9a958a" stroke-width="1.4"/>
<text x="40" y="222" font-size="13.5" font-weight="600" fill="#1b1d22">1 · Paperless</text>
<text x="40" y="246" font-size="12" fill="#5b5f68">Submit documents</text>
<text x="40" y="263" font-size="12" fill="#5b5f68">electronically, not on paper</text>
<path d="M222 256H238" fill="none" stroke="#9a958a" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="240" y="152" width="196" height="120" rx="8" fill="none" stroke="#9a958a" stroke-width="1.4"/>
<text x="256" y="178" font-size="13.5" font-weight="600" fill="#1b1d22">2 · InfoLess</text>
<text x="256" y="202" font-size="12" fill="#5b5f68">Stop asking for what we</text>
<text x="256" y="219" font-size="12" fill="#5b5f68">can fetch ourselves (Part 2)</text>
<path d="M438 212H454" fill="none" stroke="#9a958a" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="456" y="88" width="284" height="300" rx="8" fill="#e2ece9" stroke="#0f5b57" stroke-width="2"/>
<text x="472" y="114" font-size="13.5" font-weight="600" fill="#0f5b57">3 · InfoLeast</text>
<text x="472" y="138" font-size="12" fill="#5b5f68">For low-risk clients, ask only</text>
<text x="472" y="155" font-size="12" fill="#5b5f68">for the minimum the rules require</text>
<rect x="470" y="186" width="256" height="52" rx="8" fill="#fffdf8" stroke="#9a958a" stroke-width="1.4"/>
<text x="484" y="207" font-size="12" font-weight="600" fill="#1b1d22">Fast lane before payment</text>
<text x="484" y="225" font-size="11" fill="#5b5f68">rules or AI route low-risk cases first</text>
<rect x="470" y="248" width="256" height="52" rx="8" fill="#fffdf8" stroke="#9a958a" stroke-width="1.4"/>
<text x="484" y="269" font-size="12" font-weight="600" fill="#1b1d22">Stronger alerts after payment</text>
<text x="484" y="287" font-size="11" fill="#5b5f68">rules or AI flag issues for review</text>
<rect x="470" y="310" width="256" height="52" rx="8" fill="#fffdf8" stroke="#9a958a" stroke-width="1.4"/>
<text x="484" y="331" font-size="12" font-weight="600" fill="#1b1d22">Human in the loop, always</text>
<text x="484" y="349" font-size="11" fill="#5b5f68">switch any scenario back to manual review</text>
<text x="24" y="352" font-size="12" fill="#5b5f68">Enabled by the regulator's trade facilitation pilot [1]</text>
<text x="24" y="376" font-size="12" fill="#1b1d22">Driven by training for sales, relationship managers and clients</text>
</svg>
