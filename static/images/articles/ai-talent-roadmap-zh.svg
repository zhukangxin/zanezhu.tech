<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" role="img" aria-label="AI按阶段赢得自主权：凭证据，而非按日历" font-family="-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>AI按阶段赢得自主权：凭证据，而非按日历</title>
<rect width="760" height="492" rx="14" fill="#fffdf8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a958a"/></marker></defs>
<text x="24" y="34" font-size="16" font-weight="600" fill="#1b1d22">AI按阶段赢得自主权：凭证据，而非按日历</text>
<text x="24" y="54" font-size="11.5" fill="#5b5f68">一个AI使用场景的培养计划，就像新员工的培养计划</text>
<rect x="24" y="72" width="158" height="248" rx="8" fill="#ffffff" stroke="#9a958a" stroke-width="1.25"/>
<line x1="40" x2="166" y1="112" y2="112" stroke="#ddd6c7"/>
<text x="40" y="98" font-size="13.5" font-weight="600" fill="#0f5b57">1. 实习生</text>
<text x="40" y="132" font-size="10.5" font-weight="600" fill="#5b5f68">工作</text>
<text x="40" y="150" font-size="11.5" fill="#1b1d22">起草、摘要、</text>
<text x="40" y="166" font-size="11.5" fill="#1b1d22">初步分析</text>
<text x="40" y="192" font-size="10.5" font-weight="600" fill="#5b5f68">权限</text>
<text x="40" y="210" font-size="11.5" fill="#1b1d22">只读；测试数据</text>
<text x="40" y="252" font-size="10.5" font-weight="600" fill="#5b5f68">复核</text>
<text x="40" y="270" font-size="11.5" fill="#1b1d22">人工检查每一项</text>
<text x="40" y="286" font-size="11.5" fill="#1b1d22">产出</text>
<rect x="200" y="72" width="158" height="248" rx="8" fill="#ffffff" stroke="#9a958a" stroke-width="1.25"/>
<line x1="216" x2="342" y1="112" y2="112" stroke="#ddd6c7"/>
<text x="216" y="98" font-size="13.5" font-weight="600" fill="#0f5b57">2. 助理</text>
<text x="216" y="132" font-size="10.5" font-weight="600" fill="#5b5f68">工作</text>
<text x="216" y="150" font-size="11.5" fill="#1b1d22">有明确标准的</text>
<text x="216" y="166" font-size="11.5" fill="#1b1d22">既定任务</text>
<text x="216" y="192" font-size="10.5" font-weight="600" fill="#5b5f68">权限</text>
<text x="216" y="210" font-size="11.5" fill="#1b1d22">只能写草稿；</text>
<text x="216" y="226" font-size="11.5" fill="#1b1d22">由人发送</text>
<text x="216" y="252" font-size="10.5" font-weight="600" fill="#5b5f68">复核</text>
<text x="216" y="270" font-size="11.5" fill="#1b1d22">发布前</text>
<text x="216" y="286" font-size="11.5" fill="#1b1d22">须人工审批</text>
<rect x="376" y="72" width="158" height="248" rx="8" fill="#ffffff" stroke="#9a958a" stroke-width="1.25"/>
<line x1="392" x2="518" y1="112" y2="112" stroke="#ddd6c7"/>
<text x="392" y="98" font-size="13.5" font-weight="600" fill="#0f5b57">3. 专员</text>
<text x="392" y="132" font-size="10.5" font-weight="600" fill="#5b5f68">工作</text>
<text x="392" y="150" font-size="11.5" fill="#1b1d22">独立负责范围窄、</text>
<text x="392" y="166" font-size="11.5" fill="#1b1d22">可撤回的任务</text>
<text x="392" y="192" font-size="10.5" font-weight="600" fill="#5b5f68">权限</text>
<text x="392" y="210" font-size="11.5" fill="#1b1d22">限定范围的权限；</text>
<text x="392" y="226" font-size="11.5" fill="#1b1d22">不给生产环境密钥</text>
<text x="392" y="252" font-size="10.5" font-weight="600" fill="#5b5f68">复核</text>
<text x="392" y="270" font-size="11.5" fill="#1b1d22">抽样检查；</text>
<text x="392" y="286" font-size="11.5" fill="#1b1d22">随时可回滚</text>
<rect x="552" y="72" width="158" height="248" rx="8" fill="#ffffff" stroke="#9a958a" stroke-width="1.25"/>
<line x1="568" x2="694" y1="112" y2="112" stroke="#ddd6c7"/>
<text x="568" y="98" font-size="13.5" font-weight="600" fill="#0f5b57">4. 独当一面</text>
<text x="568" y="132" font-size="10.5" font-weight="600" fill="#5b5f68">工作</text>
<text x="568" y="150" font-size="11.5" fill="#1b1d22">多步骤工作流；</text>
<text x="568" y="166" font-size="11.5" fill="#1b1d22">边界情况上报</text>
<text x="568" y="192" font-size="10.5" font-weight="600" fill="#5b5f68">权限</text>
<text x="568" y="210" font-size="11.5" fill="#1b1d22">更广、留痕、</text>
<text x="568" y="226" font-size="11.5" fill="#1b1d22">可撤销的权限</text>
<text x="568" y="252" font-size="10.5" font-weight="600" fill="#5b5f68">复核</text>
<text x="568" y="270" font-size="11.5" fill="#1b1d22">看结果指标；</text>
<text x="568" y="286" font-size="11.5" fill="#1b1d22">高风险决策</text>
<text x="568" y="302" font-size="11.5" fill="#1b1d22">仍由人做</text>
<path d="M24 352H181" fill="none" stroke="#9a958a" stroke-width="1.25"/>
<path d="M201 352H357" fill="none" stroke="#9a958a" stroke-width="1.25"/>
<path d="M377 352H533" fill="none" stroke="#9a958a" stroke-width="1.25"/>
<path d="M553 352H712" fill="none" stroke="#9a958a" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="712" y="342" font-size="11.5" fill="#5b5f68" text-anchor="end">时间</text>
<path d="M191 342l10 10l-10 10l-10 -10z" fill="#e2ece9" stroke="#0f5b57" stroke-width="1.5"/>
<text x="191" y="334" font-size="11.5" font-weight="600" fill="#1b1d22" text-anchor="middle">关卡 1</text>
<text x="191" y="380" font-size="11.5" fill="#5b5f68" text-anchor="middle">通过基于自身任务的</text>
<text x="191" y="396" font-size="11.5" fill="#5b5f68" text-anchor="middle">评估测试集</text>
<path d="M367 342l10 10l-10 10l-10 -10z" fill="#e2ece9" stroke="#0f5b57" stroke-width="1.5"/>
<text x="367" y="334" font-size="11.5" font-weight="600" fill="#1b1d22" text-anchor="middle">关卡 2</text>
<text x="367" y="380" font-size="11.5" fill="#5b5f68" text-anchor="middle">抽样复核中</text>
<text x="367" y="396" font-size="11.5" fill="#5b5f68" text-anchor="middle">错误率低</text>
<path d="M543 342l10 10l-10 10l-10 -10z" fill="#e2ece9" stroke="#0f5b57" stroke-width="1.5"/>
<text x="543" y="334" font-size="11.5" font-weight="600" fill="#1b1d22" text-anchor="middle">关卡 3</text>
<text x="543" y="380" font-size="11.5" fill="#5b5f68" text-anchor="middle">无重大事故；</text>
<text x="543" y="396" font-size="11.5" fill="#5b5f68" text-anchor="middle">回滚已验证</text>
<rect x="24" y="416" width="686" height="52" rx="8" fill="#efeadf" stroke="#9a958a" stroke-width="1.25"/>
<text x="367" y="438" font-size="13" font-weight="600" fill="#1b1d22" text-anchor="middle">每次模型升级或每季度重新测试</text>
<text x="367" y="456" font-size="11.5" fill="#5b5f68" text-anchor="middle">凭证据晋升；结果下滑时退回上一阶段</text>
</svg>
