<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" role="img" aria-label="AI earns autonomy stage by stage, on evidence, not the calendar" font-family="-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>AI earns autonomy stage by stage, on evidence, not the calendar</title>
<rect width="760" height="492" rx="14" fill="#fffdf8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a958a"/></marker></defs>
<text x="24" y="34" font-size="16" font-weight="600" fill="#1b1d22">AI earns autonomy stage by stage, on evidence, not the calendar</text>
<text x="24" y="54" font-size="11.5" fill="#5b5f68">A development plan for one AI use case, like a plan for a new hire</text>
<rect x="24" y="72" width="158" height="248" rx="8" fill="#ffffff" stroke="#9a958a" stroke-width="1.25"/>
<line x1="40" x2="166" y1="112" y2="112" stroke="#ddd6c7"/>
<text x="40" y="98" font-size="13.5" font-weight="600" fill="#0f5b57">1. Intern</text>
<text x="40" y="132" font-size="10.5" font-weight="600" fill="#5b5f68">WORK</text>
<text x="40" y="150" font-size="11.5" fill="#1b1d22">Drafts, summaries,</text>
<text x="40" y="166" font-size="11.5" fill="#1b1d22">first-pass analysis</text>
<text x="40" y="192" font-size="10.5" font-weight="600" fill="#5b5f68">ACCESS</text>
<text x="40" y="210" font-size="11.5" fill="#1b1d22">Read-only; test data</text>
<text x="40" y="252" font-size="10.5" font-weight="600" fill="#5b5f68">REVIEW</text>
<text x="40" y="270" font-size="11.5" fill="#1b1d22">Human checks every</text>
<text x="40" y="286" font-size="11.5" fill="#1b1d22">output</text>
<rect x="200" y="72" width="158" height="248" rx="8" fill="#ffffff" stroke="#9a958a" stroke-width="1.25"/>
<line x1="216" x2="342" y1="112" y2="112" stroke="#ddd6c7"/>
<text x="216" y="98" font-size="13.5" font-weight="600" fill="#0f5b57">2. Assistant</text>
<text x="216" y="132" font-size="10.5" font-weight="600" fill="#5b5f68">WORK</text>
<text x="216" y="150" font-size="11.5" fill="#1b1d22">Defined tasks with</text>
<text x="216" y="166" font-size="11.5" fill="#1b1d22">clear standards</text>
<text x="216" y="192" font-size="10.5" font-weight="600" fill="#5b5f68">ACCESS</text>
<text x="216" y="210" font-size="11.5" fill="#1b1d22">Writes drafts only;</text>
<text x="216" y="226" font-size="11.5" fill="#1b1d22">a human sends</text>
<text x="216" y="252" font-size="10.5" font-weight="600" fill="#5b5f68">REVIEW</text>
<text x="216" y="270" font-size="11.5" fill="#1b1d22">Human approves</text>
<text x="216" y="286" font-size="11.5" fill="#1b1d22">before release</text>
<rect x="376" y="72" width="158" height="248" rx="8" fill="#ffffff" stroke="#9a958a" stroke-width="1.25"/>
<line x1="392" x2="518" y1="112" y2="112" stroke="#ddd6c7"/>
<text x="392" y="98" font-size="13.5" font-weight="600" fill="#0f5b57">3. Specialist</text>
<text x="392" y="132" font-size="10.5" font-weight="600" fill="#5b5f68">WORK</text>
<text x="392" y="150" font-size="11.5" fill="#1b1d22">Owns narrow,</text>
<text x="392" y="166" font-size="11.5" fill="#1b1d22">reversible tasks</text>
<text x="392" y="192" font-size="10.5" font-weight="600" fill="#5b5f68">ACCESS</text>
<text x="392" y="210" font-size="11.5" fill="#1b1d22">Scoped permissions;</text>
<text x="392" y="226" font-size="11.5" fill="#1b1d22">no production keys</text>
<text x="392" y="252" font-size="10.5" font-weight="600" fill="#5b5f68">REVIEW</text>
<text x="392" y="270" font-size="11.5" fill="#1b1d22">Sampled spot checks;</text>
<text x="392" y="286" font-size="11.5" fill="#1b1d22">rollback ready</text>
<rect x="552" y="72" width="158" height="248" rx="8" fill="#ffffff" stroke="#9a958a" stroke-width="1.25"/>
<line x1="568" x2="694" y1="112" y2="112" stroke="#ddd6c7"/>
<text x="568" y="98" font-size="13.5" font-weight="600" fill="#0f5b57">4. Operator</text>
<text x="568" y="132" font-size="10.5" font-weight="600" fill="#5b5f68">WORK</text>
<text x="568" y="150" font-size="11.5" fill="#1b1d22">Multi-step workflows;</text>
<text x="568" y="166" font-size="11.5" fill="#1b1d22">escalates edge cases</text>
<text x="568" y="192" font-size="10.5" font-weight="600" fill="#5b5f68">ACCESS</text>
<text x="568" y="210" font-size="11.5" fill="#1b1d22">Broader, logged,</text>
<text x="568" y="226" font-size="11.5" fill="#1b1d22">revocable access</text>
<text x="568" y="252" font-size="10.5" font-weight="600" fill="#5b5f68">REVIEW</text>
<text x="568" y="270" font-size="11.5" fill="#1b1d22">Outcome metrics;</text>
<text x="568" y="286" font-size="11.5" fill="#1b1d22">humans keep</text>
<text x="568" y="302" font-size="11.5" fill="#1b1d22">high-stakes calls</text>
<path d="M24 352H181" fill="none" stroke="#9a958a" stroke-width="1.25"/>
<path d="M201 352H357" fill="none" stroke="#9a958a" stroke-width="1.25"/>
<path d="M377 352H533" fill="none" stroke="#9a958a" stroke-width="1.25"/>
<path d="M553 352H712" fill="none" stroke="#9a958a" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="712" y="342" font-size="11.5" fill="#5b5f68" text-anchor="end">Time</text>
<path d="M191 342l10 10l-10 10l-10 -10z" fill="#e2ece9" stroke="#0f5b57" stroke-width="1.5"/>
<text x="191" y="334" font-size="11.5" font-weight="600" fill="#1b1d22" text-anchor="middle">Gate 1</text>
<text x="191" y="380" font-size="11.5" fill="#5b5f68" text-anchor="middle">Passes eval set on</text>
<text x="191" y="396" font-size="11.5" fill="#5b5f68" text-anchor="middle">your own tasks</text>
<path d="M367 342l10 10l-10 10l-10 -10z" fill="#e2ece9" stroke="#0f5b57" stroke-width="1.5"/>
<text x="367" y="334" font-size="11.5" font-weight="600" fill="#1b1d22" text-anchor="middle">Gate 2</text>
<text x="367" y="380" font-size="11.5" fill="#5b5f68" text-anchor="middle">Low error rate in a</text>
<text x="367" y="396" font-size="11.5" fill="#5b5f68" text-anchor="middle">reviewed sample</text>
<path d="M543 342l10 10l-10 10l-10 -10z" fill="#e2ece9" stroke="#0f5b57" stroke-width="1.5"/>
<text x="543" y="334" font-size="11.5" font-weight="600" fill="#1b1d22" text-anchor="middle">Gate 3</text>
<text x="543" y="380" font-size="11.5" fill="#5b5f68" text-anchor="middle">Clean incident record;</text>
<text x="543" y="396" font-size="11.5" fill="#5b5f68" text-anchor="middle">rollback tested</text>
<rect x="24" y="416" width="686" height="52" rx="8" fill="#efeadf" stroke="#9a958a" stroke-width="1.25"/>
<text x="367" y="438" font-size="13" font-weight="600" fill="#1b1d22" text-anchor="middle">Re-test at every model release, or each quarter</text>
<text x="367" y="456" font-size="11.5" fill="#5b5f68" text-anchor="middle">Promote on evidence; move back a stage when results fall</text>
</svg>
