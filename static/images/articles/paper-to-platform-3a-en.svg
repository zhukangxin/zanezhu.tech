<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="The series on one path: All Online → Automatic → Autonomous" font-family="-apple-system,'Segoe UI','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a958a"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f5b57"/></marker></defs>
<rect width="760" height="400" rx="14" fill="#fffdf8"/>
<text x="24" y="36" font-size="16" font-weight="600" fill="#1b1d22">The series on one path: All Online → Automatic → Autonomous</text>
<rect x="24" y="64" width="216" height="264" rx="8" fill="none" stroke="#9a958a" stroke-width="1.4"/>
<text x="40" y="90" font-size="13.5" font-weight="600" fill="#1b1d22">All Online</text>
<text x="40" y="110" font-size="12" fill="#5b5f68">Structure the data</text>
<rect x="36" y="126" width="192" height="84" rx="8" fill="#fffdf8" stroke="#9a958a" stroke-width="1.4"/>
<text x="48" y="150" font-size="12" font-weight="600" fill="#1b1d22">Part 2 · Fetch the data</text>
<text x="48" y="172" font-size="11.5" fill="#5b5f68">documents become structured</text>
<text x="48" y="189" font-size="11.5" fill="#5b5f68">online data</text>
<rect x="36" y="224" width="192" height="84" rx="8" fill="#fffdf8" stroke="#9a958a" stroke-width="1.4"/>
<text x="48" y="248" font-size="12" font-weight="600" fill="#1b1d22">Part 3 · Roll out by maturity</text>
<text x="48" y="270" font-size="11.5" fill="#5b5f68">Paperless → InfoLess →</text>
<text x="48" y="287" font-size="11.5" fill="#5b5f68">InfoLeast</text>
<path d="M242 196H270" fill="none" stroke="#9a958a" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="272" y="64" width="216" height="264" rx="8" fill="none" stroke="#9a958a" stroke-width="1.4"/>
<text x="288" y="90" font-size="13.5" font-weight="600" fill="#1b1d22">Automatic</text>
<text x="288" y="110" font-size="12" fill="#5b5f68">Automate confirmed rules</text>
<rect x="284" y="126" width="192" height="84" rx="8" fill="#fffdf8" stroke="#9a958a" stroke-width="1.4"/>
<text x="296" y="150" font-size="12" font-weight="600" fill="#1b1d22">Part 1 · Configurable rules</text>
<text x="296" y="172" font-size="11.5" fill="#5b5f68">automate agreed rules,</text>
<text x="296" y="189" font-size="11.5" fill="#5b5f68">leave room for AI</text>
<path d="M490 196H518" fill="none" stroke="#9a958a" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="520" y="64" width="216" height="264" rx="8" fill="#e2ece9" stroke="#0f5b57" stroke-width="2" stroke-dasharray="5 4"/>
<text x="536" y="90" font-size="13.5" font-weight="600" fill="#0f5b57">Autonomous</text>
<text x="536" y="110" font-size="12" fill="#5b5f68">AI within guardrails</text>
<rect x="532" y="126" width="192" height="84" rx="8" fill="#fffdf8" stroke="#9a958a" stroke-width="1.4"/>
<text x="544" y="150" font-size="12" font-weight="600" fill="#0f5b57">Where it begins (Part 3)</text>
<text x="544" y="172" font-size="11.5" fill="#5b5f68">human in the loop,</text>
<text x="544" y="189" font-size="11.5" fill="#5b5f68">the graduation question</text>
<rect x="532" y="224" width="192" height="84" rx="8" fill="#fffdf8" stroke="#9a958a" stroke-width="1.4"/>
<text x="544" y="248" font-size="12" font-weight="600" fill="#0f5b57">The hardest step</text>
<text x="544" y="270" font-size="11.5" fill="#5b5f68">AI gradually replaces manual</text>
<text x="544" y="287" font-size="11.5" fill="#5b5f68">judgment and rigid rules</text>
<path d="M628 330V362H132V332" fill="none" stroke="#9a958a" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar)"/>
<text x="380" y="386" font-size="12" text-anchor="middle" fill="#5b5f68">Each stage pays for itself and remains the fallback for the next</text>
</svg>
